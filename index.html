var TABS=[['smp','SMP vs. multicore'],['atlas','Visual protocol atlas'],['latency','Latency tolerance & overhead'],['core','Inside the core'],['queue','Queueing theory'],['arch','ARCH# reference & operations']];
function tabBody(t){
  if(t==='smp')return'<div class="hsec"><span class="hx">SMP vs. multicore (CMP)</span><span class="hd">why the bus is the story</span></div>'+diaSmp()+'<p class="diacap">Left: the machine this console simulates. Right: a modern multicore, shown only to mark the difference.</p>'+
    '<div class="prose"><p>NEXUS-3 models a <b>bus-based symmetric multiprocessor</b> of the late 1990s: 4 to 16 discrete processor modules, each a 64-bit out-of-order RISC core (MIPS R10000 / UltraSPARC class) with a private on-chip L1 and a private off-chip L2, plugged into one backplane. All of them reach one main memory over one shared, split-transaction bus, in the style of SGI Powerpath-2 and Sun Gigaplane. Memory is equally far from every processor, which is what UMA means.</p>'+
    '<p>That bus is the scarce resource. A miss costs tens of bus cycles, every coherence action is a broadcast that all snoop controllers must see, and only one address phase and one data phase can be on the wires at a time. Adding processors adds demand but no bus. This is why the same program can scale well at 4 CPUs and collapse at 16, and why the choice between updating and invalidating other caches matters so much.</p>'+
    '<p>A chip multiprocessor keeps the same coherence ideas but moves them on-chip: cores sit a few cycles apart, usually share a last-level cache, and talk over a ring or mesh that carries many messages at once. The lessons transfer, the constants do not. Nothing in this console should be read as a model of a multicore.</p>'+
    '<h3>Reference machine</h3><dl class="gloss"><dt>Processors</dt><dd>4, 8 or 16 modules · '+T.WIDTH+'-wide, '+T.ROB+'-entry reorder window, '+T.WB+'-entry write buffer, 1–8 MSHRs</dd><dt>L1</dt><dd>'+T.L1KB+' KB data, direct-mapped in the model (instruction cache not simulated)</dd><dt>L2</dt><dd>512 KB – 2 MB unified, 2-way, strict inclusion, external snoop controller</dd><dt>Block size</dt><dd>32, 64 or 128 bytes, selectable</dd><dt>Bus</dt><dd>address phase '+T.ADDR+' cycles, snoop result after '+T.SNOOP+', 256-bit data path, '+T.MAXOUT+' outstanding transactions, round-robin arbiter</dd><dt>Memory</dt><dd>'+T.BANKS+' interleaved SDRAM banks, '+T.MEMLAT+'-cycle access, '+T.TRC+'-cycle bank cycle time</dd><dt>Clock</dt><dd>one simulation cycle = one bus clock; 1× is 60 cycles per second on screen</dd></dl></div>';
  if(t==='atlas')return'<div class="hsec"><span class="hx">Visual protocol atlas</span><span class="hd">Dragon · MESI · WTI</span></div>'+
    '<div class="grid c3 mb">'+['DRAGON','MESI','WTI'].map(function(p,i){return panel(p==='DRAGON'?'Dragon · update':p==='MESI'?'MESI · invalidate':'WTI · write-through',p==='WTI'?'2 states':'4 states',NX.fsmSVG(p,'h'+i));}).join('')+'</div>'+
    '<div class="kin-legend" style="margin-bottom:14px"><span><i style="background:'+COL.cyan+'"></i>solid: the processor reads or writes (PrRd / PrWr), with the bus transaction it issues after the slash</span><span><i style="background:'+COL.amber+'"></i>dashed: another processor\'s transaction observed by the snoop controller</span><span>(S) / (S̄): the wired-OR Shared line was / was not asserted</span></div>'+
    diaTiming()+'<p class="diacap">The same six accesses under each protocol. Solid boxes go on the bus; dashed boxes stay inside the cache.</p>'+
    '<div class="prose"><h3>Dragon · four-state write-back update</h3><p>A write to a shared line broadcasts just the changed word (<b>BusUpd</b>); the other caches patch their copy and stay valid. <b>Sm</b> marks the one cache responsible for eventually writing the line back. No one ever misses because of sharing. The price is that every write to a line somebody else still holds is a bus transaction, even if that somebody never looks at it again. Long write-runs are Dragon\'s worst case.</p>'+
    '<h3>MESI · four-state write-back invalidate</h3><p>The first write to a shared line destroys the other copies (<b>BusUpgr</b>, or <b>BusRdX</b> on a miss). After that the writer owns the line in <b>M</b> and writes for free. The price moves to the readers: their next access is a coherence miss served by the owner. When each write is followed by reads elsewhere, MESI misses on every one. <b>E</b> lets private data upgrade silently.</p>'+
    '<h3>WTI · write-through invalidate</h3><p>The baseline. Memory is always current because every write goes through the bus (<b>BusWr</b>) and invalidates other copies on the way. Two states, trivial controller, and a bus that saturates at a handful of processors.</p>'+
    '<h3>How the console classifies a miss</h3><ul><li><b>Cold / capacity</b>: the line was never here or was evicted for space.</li><li><b>True sharing</b>: the line was invalidated and the word now being accessed was written by another processor since.</li><li><b>False sharing</b>: the line was invalidated, but only other words in the block changed. Block size alone decides whether this happens.</li></ul></div>';
  if(t==='latency')return'<div class="hsec"><span class="hx">Anatomy of latency tolerance & overhead</span><span class="hd">Culler · Singh · Gupta, chapter 11</span></div>'+
    '<div class="prose"><h3>Where a cycle goes</h3><p>Each processor cycle is charged to exactly one bucket, and the buckets add up to the effective CPI:</p><dl class="gloss">'+NX.CPI.map(function(c){return'<dt style="color:'+c[3]+'">CPI '+c[1].toLowerCase()+'</dt><dd>'+({cpi_base:'at least one instruction retired this cycle',cpi_local:'waiting on a cold or capacity miss in service, or paying the L1-miss / L2-hit penalty',cpi_coherence:'waiting on a transaction that exists because of sharing: an upgrade, an update, a write-through, or the refill of an invalidated line',cpi_bus:'the transaction this CPU needs is still in the arbitration queue or waiting for the data bus',cpi_sync:'spinning on a held lock, waiting at a barrier, or draining the write buffer at a fence'})[c[0]]+'</dd>';}).join('')+'</dl>'+
    '<h3>Non-blocking caches</h3></div>'+diaMshr()+'<p class="diacap">Miss Status Holding Registers let several fills be in flight. The gain depends on misses arriving close together, which is why it shows on Ocean and barely on Barnes-Hut.</p>'+
    '<div class="prose"><h3>Hardware stride prefetching</h3></div>'+diaPf()+'<p class="diacap">A prefetch is a bet placed on the bus. On a saturated bus a lost bet delays somebody\'s real miss.</p>'+
    '<div class="prose"><h3>Write buffers and memory consistency</h3></div>'+diaCons()+'<p class="diacap">The weaker the model, the more write latency the buffer can hide, and the more there is to flush when a lock or barrier demands order.</p>'+
    '<div class="prose"><h3>Bus overhead in one sentence each</h3><ul><li><b>Bus utilization</b>: share of cycles in which the address or the data lines are driven.</li><li><b>Protocol overhead ratio</b>: of those busy cycles, the share spent on coherence traffic rather than on fetching data a program needed for the first time.</li><li><b>Mean write-run length</b>: how many times one processor writes a shared location before another processor touches it. Long runs favour invalidation, runs near 1 favour update.</li><li><b>Arbitration queue depth</b>: transactions waiting for the address bus. It stays near zero until utilization passes roughly 85 %, then grows without bound.</li></ul></div>';
  if(t==='queue')return NX.helpQueue();
  if(t==='core')return'<div class="hsec"><span class="hx">Inside the core</span><span class="hd">guide to the Core Datapath view</span></div>'+diaCore()+'<p class="diacap">The stages drawn on the Core Datapath page (Processor menu), for the CPU selected in the top strip.</p>'+
    '<div class="grid c2"><div class="prose"><h3>What the page shows</h3><p>The Core Datapath view opens up one processor module and follows each instruction through it. The block diagram is styled after the MIPS R10000: instructions are fetched, renamed, parked in one of three queues, executed out of order, and graduated in program order.</p>'+
    '<dl class="gloss"><dt>PC · I-cache</dt><dd>Program counter and instruction fetch, '+T.WIDTH+' instructions per cycle.</dd><dt>Decode · rename</dt><dd>Each destination register gets a fresh physical register from the free list, so later instructions do not wait on a name.</dd><dt>Active list</dt><dd>The reorder window, '+T.ROB+' entries. The bar shows how far execution has run ahead of the oldest unresolved load; when it fills, the core stops.</dd><dt>Queues</dt><dd>Integer, address and floating-point queues hold instructions until their operands are ready.</dd><dt>ALU 1 · ALU 2</dt><dd>Integer units. ALU 1 also does shifts and resolves branches; ALU 2 also multiplies. Each shows operand A, operand B, the operation and the result.</dd><dt>Address calc · TLB</dt><dd>Adds base register and offset to form the effective address of a load or store.</dd><dt>FPU</dt><dd>Floating-point add, multiply and divide. FP register values are not shown.</dd><dt>L1 D-cache</dt><dd>Reports the outcome of the access: L1 hit, L2 hit, or a miss that goes to the bus.</dd><dt>Write buffer · MSHR table</dt><dd>Stores waiting for bus ownership, and misses in flight.</dd><dt>System interface</dt><dd>The pins of the module. Lists the transactions this CPU has outstanding and flashes red or amber when an invalidation or an update is snooped from another processor.</dd><dt>Graduate</dt><dd>Results are committed to the register file in program order.</dd></dl>'+
    '<h3>What is real and what is synthesized</h3><p>The simulation engine models each processor\'s <b>memory-reference stream</b>; it does not execute programs. On this page:</p><ul><li><b>Live engine state</b>: effective addresses, cache outcomes, the pipeline state and its stall cause, active-list occupancy, write buffer, MSHRs, outstanding bus transactions and snoops received.</li><li><b>Synthesized</b>: opcodes, register numbers and register values. They are generated deterministically from the reference stream, and base registers are set so that base + offset equals the real effective address.</li></ul><p class="dim">The Signals now table marks every row as <b>engine</b> or <b>synth</b>. Branch misprediction is not modelled, so branches never cost cycles here.</p></div>'+
    '<div class="prose"><h3>Reading the panels</h3><ul><li><b>Datapath.</b> The bright route is the instruction shown at the bottom left of the diagram. Dots are instructions in flight, sampled at high clock rates.</li><li><b>Integer register file.</b> The 32 logical registers with the physical register each one currently maps to. Cyan cells were read and the amber cell was written by the instruction shown.</li><li><b>Signals now.</b> One row per signal with its current value and its source.</li><li><b>Instruction log.</b> The last 40 instructions, newest first: cycle, PC, instruction, unit, operands, result, memory outcome and destination.</li></ul>'+
    '<h3>Freeze, step and replay</h3><dl class="gloss"><dt>Freeze</dt><dd>Holds this page only. The diagram, registers, signals and log stop updating; the machine keeps running and every other view stays live.</dd><dt>Unfreeze</dt><dd>Resumes from the current moment. Only the most recent instructions that ran while frozen are added to the log; older ones are skipped.</dd><dt>Click a log row</dt><dd>Freezes the view and replays that instruction on the diagram, with its registers highlighted. Click it again to release it.</dd><dt>Step 1 bus cycle</dt><dd>Pauses the whole simulation and advances it one cycle (up to '+T.WIDTH+' instructions). Use it to watch a single miss travel to the bus.</dd><dt>Run live</dt><dd>Resumes the simulation clock.</dd><dt>Clear log</dt><dd>Empties the instruction log.</dd></dl>'+
    '<h3>Things to try</h3><ul><li>Select <b>Lock Contention</b> in the Lab and watch <b>sc</b> (lock acquire) stores go to the write buffer while the pipeline state turns violet.</li><li>Compare <b>MSHR depth 1</b> and <b>4</b> on Ocean: with 1 the core stops at the second miss while the first is still in flight; with 4 it runs on, and the active list can fill behind the oldest load and turn red.</li><li>Switch to <b>PC</b> or <b>RC</b> consistency and watch stores leave through the write buffer while loads keep executing.</li><li>Run <b>False Sharing</b> at 128 B and watch the system interface flash red on every snooped invalidation.</li></ul></div></div>';
  return'<div class="hsec"><span class="hx">ARCH# language reference & console operations</span><span class="hd">Phase A · read-only</span></div><div class="grid c2"><div class="prose">'+
    '<p>ARCH# is a small deterministic query language over the live telemetry, modelled on NX-Script (NEXUS-1) and SAT# (NEXUS-2). In Phase A it can only read. There is no verb that changes the machine, and the parser rejects anything that looks like one.</p>'+
    '<h3>Reading one signal</h3>'+code('get sys.ipc                 # aggregate instructions per cycle\nget bus.overhead_ratio\nget cpu.cpi                 # the CPU selected in the top strip\nget cpu[5].cpi_coherence    # a specific processor\nget cache.m_lines           # Modified lines in the selected L2\nget bus                     # every signal of a scope\nget qnet.n_star             # the queueing model: saturation point')+
    '<h3>Arrays and aggregation</h3>'+code('get cpus.cpi                # one value per processor\nget caches.invalid_tags\nmean(cpus.cpi)\nmax(cpus.cpi_bus_stall)     # also reports which CPU\nsum(caches.m_lines)')+
    '<h3>Filtering</h3>'+code('get cpus where cpi_coherence > 1.2 select cpi\nget cpus where false_share_mpki > 2 and ipc < 1.5 select coh_mpki\nmax(cpus where cpi_sync > 0.5 select cpi)')+
    '<h3>Grammar</h3>'+code('query  := get target | agg ( target ) | schema [scope] | help\ntarget := scope [ . signal ] [ where cond { and cond } select signal ]\nscope  := sys | bus | mem | qnet | cpu | cpu[k] | cache | cache[k] | cpus | caches\ncond   := signal ( > | < | >= | <= | == | != ) value\nagg    := sum | mean | max | min')+
    '<p class="dim">All rates are taken over the same sliding window as the console (about 2000 bus cycles). A query never advances or pauses the clock, so two queries on consecutive lines can see slightly different instants unless the simulation is paused.</p></div>'+
    '<div class="prose"><h3>Console operations</h3><ul><li><b>System scale</b> rebuilds the machine with 4, 8 or 16 processors. Caches are flushed and re-warmed.</li><li><b>Protocol hot-swap</b> changes Dragon / MESI / WTI without flushing. Line states are converted in place (Sm becomes S under MESI, everything valid becomes V under WTI), and transactions already queued are re-interpreted when they are granted.</li><li><b>Selected CPU</b> drives the Inspector, the Core Datapath, the unindexed <b>cpu</b> and <b>cache</b> scopes, and the highlight in every chart. The selector glows when the current view depends on it.</li><li><b>Clock</b>: 1× to watch individual transactions, 10× for normal work, 100× to let a change settle. <b>Step</b> pauses and advances one bus cycle. <b>Reset</b> flushes every cache and restarts the workload.</li><li><b>Health badge</b>: NOMINAL, CONTENDED (bus above 75 % busy, or more than 40 % of CPI lost to coherence and bus waiting), SATURATED (bus above 90 % or a deep arbitration queue).</li></ul>'+
    '<h3>Where to look first</h3><dl class="gloss"><dt>Throughput is low</dt><dd>System Overview: which CPI colour dominates?</dd><dt>Amber (coherence)</dt><dd>Inspector: false or true sharing? Then block size or protocol.</dd><dt>Red (bus)</dt><dd>Interconnect: which transaction kind fills the analyzer? Root-Cause Graph for the chain.</dd><dt>Cyan (local)</dt><dd>Lab: MSHR depth and prefetcher. Digital Twin shows how much is already hidden.</dd><dt>Violet (sync)</dt><dd>Lock Contention profile and the consistency model.</dd><dt>How far will it scale?</dt><dd>Queueing Model: N*, the bus bound and the what-if sliders. See the Queueing theory tab.</dd><dt>One instruction at a time</dt><dd>Core Datapath: freeze or step, then read the log. See the Inside the core tab.</dd></dl>'+
    '<h3>Audit log</h3><p>Every change made through the top strip, the Lab or a drill is appended to a SHA-256 hash chain with the bus cycle and wall-clock time at which it took effect. Selecting a CPU, changing the clock rate and running queries are not configuration changes and are not logged.</p>'+
    '<h3>Determinism</h3><p>The workload generators use a seeded generator, so a given configuration replays the same reference stream after every Reset. Changing a parameter mid-run changes the interleaving from that point on.</p></div></div>';
}
var cur='smp';
NX.helpTab=function(t){cur=t;var b=$('#help-body');if(!b)return;b.innerHTML=tabBody(t);$$('#help-tabs .btn').forEach(function(x){var on=x.getAttribute('data-t')===t;x.classList.toggle('active',on);x.setAttribute('aria-selected',on);});};
NX.page_('help',{title:'Help & Guide',scope:'ref',sub:'Illustrated architecture guide and console manual',
  build:function(el){
    el.innerHTML='<div class="tabbar" id="help-tabs" role="tablist">'+TABS.map(function(t){return'<button class="btn" role="tab" data-t="'+t[0]+'">'+t[1]+'</button>';}).join('')+'</div><div id="help-body"></div>';
    $$('#help-tabs .btn').forEach(function(b){b.addEventListener('click',function(){NX.helpTab(b.getAttribute('data-t'));});});
    NX.helpTab(cur);
  }
});

NX.page_('about',{title:'About NEXUS-3',scope:'ref',sub:'Author, scope and standards landscape',
  build:function(el){
    el.innerHTML='<div class="grid c-21">'+panel('About NEXUS-3 — Author &amp; Scope','Phase 0 · read me',
      '<div class="prose"><p>I\'m <b>Grigorios Agathangelidis</b>. I am not a computer architect, a processor designer, or a performance engineer for multiprocessor servers — my background is in <b>Electrical Engineering and Software Engineering</b>.</p>'+
      '<p>NEXUS-3 is a personal project and the sibling of NEXUS-1 and NEXUS-2. After a nuclear-plant console and a satellite-constellation console, I wanted a third demanding domain, and this time one much closer to the machines I write software for every day. The starting point was a return to Culler, Singh and Gupta\'s <i>Parallel Computer Architecture: A Hardware/Software Approach</i>: the chapters on shared-memory multiprocessors, snoop-based cache coherence and latency tolerance. Reading about write-runs and invalidation misses is one thing. I wanted to watch them happen on a bus, cycle by cycle, and be able to change the protocol while the machine was running.</p>'+
      '<p>My goal was never to present myself as an expert in computer architecture — it was to study a classic body of work as thoroughly as I could and apply my own skills in <b>software architecture, simulation, visualization, user interfaces, systems design, and language design</b>.</p>'+
      '<p>The models in this project are <b>studied and representative — not validated, calibrated, or machine-specific</b>. Some parts are structurally real: the Dragon, MESI and write-through state machines, atomic bus ordering of transactions, split address and data phases, inclusion between L1 and L2, MSHR-limited miss overlap, a FIFO write buffer with consistency-dependent draining, and the classification of misses into cold, true-sharing and false-sharing. Their constants are generic. Bus timings, memory latency and pipeline parameters are plausible for the era but are not taken from any data sheet, and the workloads are synthetic reference generators shaped after the published behaviour of SPLASH-2 programs — they do not execute the real programs. Where something is illustrative rather than real, I have tried to say so throughout the interface.</p>'+
      '<p>What I hope comes through is the effort, curiosity, research, and engineering mindset behind the work: taking an unfamiliar and demanding domain, learning it properly, respecting the limits of that knowledge, and turning it into a coherent, working system.</p>'+
      '<p>This build is <b>Phase 0</b> of the project — the demonstration and design phase. The path toward a production system follows the same phases as NEXUS-1 and NEXUS-2: a .NET&nbsp;C# microservices backend, an Angular front end, SQL&nbsp;Server, and message-based services, with trace-driven workloads replacing the synthetic generators and the ARCH# language moving from its read-only Phase&nbsp;A to an audited, authority-checked Phase&nbsp;B.</p></div>'+
      '<div class="scope">NEXUS-3 simulates a bus-based SMP of discrete processor boards. It is explicitly not a model of a single-die multicore, of a NUMA or directory-based machine, or of any specific commercial system. No real hardware is attached and nothing in the console controls anything outside the simulation.</div>'+
      '<p class="note" style="margin-top:12px">&copy; 2026 Grigorios Agathangelidis &middot; MIT License &middot; Build NX3-C4E7A19B5D2F8036<br>Demonstration / educational software — not a validated architecture simulator and not a performance-prediction tool.</p>','hot')+
      '<div>'+panel('Phase 0 vs. production roadmap','where this build stands','<div class="tblwrap"><table><thead><tr><th>Area</th><th>Phase 0 (this build)</th><th>Production path</th></tr></thead><tbody>'+
        [['Delivery','One HTML file, runs in the browser','.NET C# services, Angular client, SQL Server'],['Workloads','Six synthetic reference generators','Trace-driven replay of real parallel programs'],['Timing','Generic constants, one clock domain','Per-machine parameter sets, separate CPU and bus clocks'],['Caches','Direct-mapped L1 timing filter, 2-way L2','Full set-associative hierarchy, instruction cache'],['Protocols','Dragon, MESI, WTI on one bus','MOESI, directory protocols, hierarchical buses'],['ARCH#','Phase A: read-only queries','Phase B: audited, authority-checked actions'],['Audit','In-memory hash chain','Persisted, signed, multi-operator']].map(function(r){return'<tr><td><b>'+r[0]+'</b></td><td class="dim">'+r[1]+'</td><td class="dim">'+r[2]+'</td></tr>';}).join('')+'</tbody></table></div>','mb')+
      panel('The NEXUS family','same design language','<div class="row"><div class="ln">NEXUS-1<span>nuclear plant digital twin · NX-Script</span></div><a href="https://gregory82gr.github.io/Nexus-1-phase-0" target="_blank" rel="noopener">live console</a></div><div class="row"><div class="ln">NEXUS-2<span>satellite constellation console · SAT#</span></div><a href="https://github.com/gregory82gr/Nexus-2-phase-0" target="_blank" rel="noopener">repository</a></div><div class="row"><div class="ln">NEXUS-3<span>SMP coherence &amp; latency tolerance console · ARCH#</span></div><span class="pill info">this build</span></div>')+'</div></div>'+
      '<div style="height:13px"></div>'+panel('Industry standards awareness &middot; not compliance','landscape',
      '<p class="note" style="margin-bottom:10px">A production tool of this kind would sit next to the interconnect and benchmarking standards below. This Phase&nbsp;0 demonstrator is informed by their ideas but <b>does not implement, verify against, or claim conformance with any of them</b>. They are listed to show awareness of the landscape.</p>'+
      '<div class="tblwrap"><table><thead><tr><th>Standard</th><th>What it governs</th><th>How this project relates</th></tr></thead><tbody>'+
      [['IEEE 1596 SCI','Scalable Coherent Interface: point-to-point links and a distributed, linked-list directory cache-coherence protocol that scales past a shared bus.','The road not taken here. NEXUS-3 stays on a snooped bus to expose exactly the saturation that SCI and directory machines were designed to escape. No SCI behaviour is modelled.'],
       ['AMBA ACE / CHI','Arm\'s on-chip coherence interfaces: ACE adds snoop channels to AXI; CHI is a layered, packetized protocol for many-core meshes.','The modern descendants of the same MESI-family state machines, moved on-chip. The Help guide contrasts SMP with CMP for this reason; the console does not model either interface.'],
       ['CXL','Compute Express Link: CXL.cache and CXL.mem let accelerators and memory devices take part in host cache coherence over a PCIe physical layer.','Shows that update-versus-invalidate and bus-versus-link trade-offs are current again for disaggregated memory. Out of scope for this build.'],
       ['SPEC · SPLASH-2','SPEC defines run and reporting rules for CPU and throughput benchmarks. SPLASH-2 is the Stanford suite of shared-memory parallel programs used throughout the textbook.','The three application profiles borrow the names and the published sharing characteristics of Ocean and Barnes-Hut. They are synthetic approximations, not SPLASH-2 runs, and no SPEC metric is reported or implied.']].map(function(r){return'<tr><td><b class="cy" style="white-space:nowrap">'+r[0]+'</b></td><td>'+r[1]+'</td><td class="dim">'+r[2]+'</td></tr>';}).join('')+'</tbody></table></div>'+
      '<p class="note" style="margin-top:10px">Processor ISA specifications, memory device standards such as JEDEC SDRAM timing, and system-level reliability standards are out of scope for a coherence demonstrator and are intentionally not claimed. NEXUS-3 is not certified against any standard.</p>');
  }
});
})();
